name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: rtrserver-x86_64
            binary: rtrserver
            target: x86_64-unknown-linux-gnu
            builder: cargo
          - job_name: rtrserver-aarch64
            binary: rtrserver
            target: aarch64-unknown-linux-gnu
            builder: cross
          - job_name: rtragent-mips
            binary: rtragent
            target: mips-unknown-linux-musl
            builder: musl-cross
            docker_image: messense/rust-musl-cross:mips-musl
          - job_name: rtragent-mipsel
            binary: rtragent
            target: mipsel-unknown-linux-uclibc
            builder: padavan
            toolchain_url: https://github.com/hanwckf/padavan-toolchain/releases/download/v1.0/mipsel-linux-uclibc.tar.xz
            toolchain_dir: mipsel-linux-uclibc
          - job_name: rtragent-armv7
            binary: rtragent
            target: armv7-unknown-linux-musleabihf
            builder: musl-cross
            docker_image: messense/rust-musl-cross:armv7-musleabihf
          - job_name: rtragent-x86_64
            binary: rtragent
            target: x86_64-unknown-linux-gnu
            builder: cargo
          - job_name: rtragent-aarch64
            binary: rtragent
            target: aarch64-unknown-linux-gnu
            builder: cross

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (cargo/native)
        if: matrix.builder == 'cargo'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust (cross host)
        if: matrix.builder == 'cross'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked

      - name: Build (cargo native)
        if: matrix.builder == 'cargo'
        run: cargo build --release -p ${{ matrix.binary }} --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.builder == 'cross'
        run: cross build --release -p ${{ matrix.binary }} --target ${{ matrix.target }}

      - name: Build (musl-cross docker)
        if: matrix.builder == 'musl-cross'
        run: |
          docker run --rm -v $PWD:/home/rust/src ${{ matrix.docker_image }} \
            bash -c "cargo build --release -p ${{ matrix.binary }} --target ${{ matrix.target }}"

      - name: Install Rust (padavan toolchain)
        if: matrix.builder == 'padavan'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Download Padavan toolchain
        if: matrix.builder == 'padavan'
        run: |
          wget -q "${{ matrix.toolchain_url }}" -O /tmp/toolchain.tar.xz
          sudo tar -xf /tmp/toolchain.tar.xz -C /opt
          echo "/opt/${{ matrix.toolchain_dir }}/bin" >> $GITHUB_PATH

      - name: Build (padavan)
        if: matrix.builder == 'padavan'
        env:
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_UCLIBC_LINKER: mipsel-linux-uclibc-gcc
        run: cargo build -Z build-std --release -p ${{ matrix.binary }} --target ${{ matrix.target }}

      - name: Rename & Verify
        run: |
          BIN="${{ matrix.binary }}"
          TGT="${{ matrix.target }}"
          SRC="target/${TGT}/release/${BIN}"
          OUT="${BIN}-${TGT}"
          cp "$SRC" "$OUT"
          ls -lh "$OUT"
          echo "--- ELF interpreter check ---"
          readelf -l "$OUT" 2>/dev/null | grep "interpreter" || echo "(static, no interpreter)"
          echo "--- dynamic section check ---"
          readelf -d "$OUT" 2>/dev/null | head -5 || echo "(no dynamic section)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ matrix.binary }}-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display Files
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true