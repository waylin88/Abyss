name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: rtrserver-x86_64
            binary: rtrserver
            target: x86_64-unknown-linux-gnu
            cross: false
          - job_name: rtrserver-aarch64
            binary: rtrserver
            target: aarch64-unknown-linux-gnu
            cross: true
          - job_name: rtragent-mipsel
            binary: rtragent
            target: mipsel-unknown-linux-gnu
            cross: true
          - job_name: rtragent-x86_64
            binary: rtragent
            target: x86_64-unknown-linux-gnu
            cross: false
          - job_name: rtragent-aarch64
            binary: rtragent
            target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p ${{ matrix.binary }} --target ${{ matrix.target }}
          else
            cargo build --release -p ${{ matrix.binary }} --target ${{ matrix.target }}
          fi

      - name: Strip & Rename
        run: |
          BIN="${{ matrix.binary }}"
          TGT="${{ matrix.target }}"
          SRC="target/${TGT}/release/${BIN}"
          OUT="${BIN}-${TGT}"
          if command -v llvm-strip &>/dev/null; then
            llvm-strip "$SRC" -o "$OUT" 2>/dev/null || cp "$SRC" "$OUT"
          else
            cp "$SRC" "$OUT"
          fi
          ls -lh "$OUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ matrix.binary }}-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display Files
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true