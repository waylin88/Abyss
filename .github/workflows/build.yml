name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: '要编译的目标（逗号分隔），留空编译全部。可用值：abyss-server-x86_64, abyss-server-aarch64, abyss-mips, abyss-mipsel, abyss-armv7, abyss-x86_64, abyss-aarch64'
        required: false
        default: ''
        type: string

jobs:
  build:
    if: inputs.targets == '' || contains(format(',{0},', inputs.targets), format(',{0},', matrix.job_name))
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: abyss-server-x86_64
            binary: abyss-server
            target: x86_64-unknown-linux-musl
            builder: cargo
          - job_name: abyss-server-aarch64
            binary: abyss-server
            target: aarch64-unknown-linux-gnu
            builder: cross

          # --- musl targets (参考 vnt-dev/vnt 方案) ---
          - job_name: abyss-mips
            binary: abyss
            target: mips-unknown-linux-musl
            builder: musl
            musl_uri: mips-linux-muslsf-cross
            musl_url: mips-linux-muslsf
            use_nightly: true
          - job_name: abyss-mipsel
            binary: abyss
            target: mipsel-unknown-linux-musl
            builder: musl
            musl_uri: mipsel-linux-muslsf-cross
            musl_url: mipsel-linux-muslsf
            use_nightly: true
          - job_name: abyss-armv7
            binary: abyss
            target: armv7-unknown-linux-musleabihf
            builder: musl
            musl_uri: armv7l-linux-musleabihf-cross
            musl_url: armv7l-linux-musleabihf
            use_nightly: false

          - job_name: abyss-x86_64
            binary: abyss
            target: x86_64-unknown-linux-musl
            builder: cargo
          - job_name: abyss-aarch64
            binary: abyss
            target: aarch64-unknown-linux-gnu
            builder: cross

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── native cargo build ──
      - name: Install musl-tools (for x86_64-musl)
        if: contains(matrix.target, 'musl') && matrix.builder == 'cargo'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust (cargo/native)
        if: matrix.builder == 'cargo'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (cargo native)
        if: matrix.builder == 'cargo'
        run: cargo build --release -p ${{ matrix.binary }} --target ${{ matrix.target }}

      # ── cross build (aarch64-gnu) ──
      - name: Install Rust (cross host)
        if: matrix.builder == 'cross'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.builder == 'cross'
        run: cross build --release -p ${{ matrix.binary }} --target ${{ matrix.target }}

      # ── musl cross build (参考 vnt-dev/vnt) ──
      - name: Install system dependencies
        if: matrix.builder == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools

      - name: Download musl toolchain
        if: matrix.builder == 'musl'
        env:
          MUSL_URI: ${{ matrix.musl_uri }}
        run: |
          set -euo pipefail
          mkdir -p /opt/musl_gcc
          wget -q "https://github.com/rustp2p/musl-cross/releases/download/0.0.1/${MUSL_URI}.tgz" -P /opt/musl_gcc/
          tar zxf "/opt/musl_gcc/${MUSL_URI}.tgz" -C /opt/musl_gcc/
          sudo ln -sf /opt/musl_gcc/${MUSL_URI}/bin/*gcc /usr/bin/

      - name: Install Rust (musl)
        if: matrix.builder == 'musl'
        run: |
          set -euo pipefail
          if [[ "${{ matrix.use_nightly }}" == "true" ]]; then
            rustup toolchain install nightly-x86_64-unknown-linux-gnu
            rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
          else
            rustup target add ${{ matrix.target }}
          fi

      - name: Configure musl toolchain & fixups
        if: matrix.builder == 'musl'
        env:
          TARGET: ${{ matrix.target }}
          MUSL_URI: ${{ matrix.musl_uri }}
          MUSL_URL: ${{ matrix.musl_url }}
        run: |
          set -euo pipefail
          BASE="/opt/musl_gcc/${MUSL_URI}"
          mkdir -p ~/.cargo

          # ── MIPS: libunwind workaround + nightly rust-src Cargo.lock fix ──
          if [[ "${TARGET}" =~ ^mips ]]; then
            cd "${BASE}/lib/gcc/${MUSL_URL}/11.2.1"
            cp libgcc_eh.a libunwind.a

            RUST_SRC="$HOME/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu/lib/rustlib/src/rust"
            if [[ -f "$RUST_SRC/library/Cargo.lock" && ! -f "$RUST_SRC/Cargo.lock" ]]; then
              cp -f "$RUST_SRC/library/Cargo.lock" "$RUST_SRC/Cargo.lock"
            fi
          fi

          # ── 写入 cargo config ──
          if [[ "${TARGET}" =~ ^mips ]]; then
            cat >> ~/.cargo/config.toml <<CONFIG
          [target.${TARGET}]
          linker = "${MUSL_URL}-gcc"
          rustflags = [
            "-C", "target-feature=+crt-static",
            "-C", "strip=symbols",
            "-C", "link-arg=-static",
            "-C", "relocation-model=static",
            "-C", "link-arg=-no-pie",
            "--cfg", "compiler_builtins_no_debug",
            "-L", "${BASE}/${MUSL_URL}/lib",
            "-L", "${BASE}/lib/gcc/${MUSL_URL}/11.2.1",
          ]
          CONFIG
          else
            cat >> ~/.cargo/config.toml <<CONFIG
          [target.${TARGET}]
          linker = "${MUSL_URL}-gcc"
          rustflags = ["-C", "target-feature=+crt-static", "-C", "strip=symbols"]
          CONFIG
          fi

      - name: Build (musl)
        if: matrix.builder == 'musl'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.use_nightly }}" == "true" ]]; then
            cargo +nightly build -Z build-std=std,panic_abort --release -p ${{ matrix.binary }} --target "${TARGET}"
          else
            cargo build --release -p ${{ matrix.binary }} --target "${TARGET}"
          fi

      # ── 统一重命名 & 验证 ──
      - name: Rename & Verify
        run: |
          BIN="${{ matrix.binary }}"
          TGT="${{ matrix.target }}"
          SRC="target/${TGT}/release/${BIN}"
          OUT="${BIN}-${TGT}"
          if [[ ! -f "$SRC" ]]; then
            echo "ERROR: binary not found at $SRC"
            ls -la "target/${TGT}/release/" 2>/dev/null || true
            exit 1
          fi
          cp "$SRC" "$OUT"
          ls -lh "$OUT"
          echo "--- ELF interpreter check ---"
          readelf -l "$OUT" 2>/dev/null | grep "interpreter" || echo "(static, no interpreter)"
          echo "--- dynamic section check ---"
          readelf -d "$OUT" 2>/dev/null | head -5 || echo "(no dynamic section)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ matrix.binary }}-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display Files
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true