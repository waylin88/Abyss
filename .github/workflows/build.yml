name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: rtrserver-x86_64
            binary: rtrserver
            target: x86_64-unknown-linux-gnu
            cross: false
          - job_name: rtrserver-aarch64
            binary: rtrserver
            target: aarch64-unknown-linux-gnu
            cross: true
          - job_name: rtragent-mips
            binary: rtragent
            target: mips-unknown-linux-musl
            cross: true
          - job_name: rtragent-mipsel
            binary: rtragent
            target: mipsel-unknown-linux-musl
            cross: true
          - job_name: rtragent-mipsel-uclibc
            binary: rtragent
            target: mipsel-linux-uclibc
            cross: false
          - job_name: rtragent-armv7
            binary: rtragent
            target: armv7-unknown-linux-musleabihf
            cross: true
          - job_name: rtragent-x86_64
            binary: rtragent
            target: x86_64-unknown-linux-gnu
            cross: false
          - job_name: rtragent-aarch64
            binary: rtragent
            target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (native)
        if: matrix.cross == false && matrix.target != 'mipsel-linux-uclibc'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust (cross host)
        if: matrix.cross == true
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Install mipsel-linux-uclibc toolchain
        if: matrix.target == 'mipsel-linux-uclibc'
        run: |
          wget -q https://github.com/hanwckf/padavan-toolchain/releases/download/v1.0/mipsel-linux-uclibc.tar.xz
          tar xf mipsel-linux-uclibc.tar.xz
          ls -la
          TOOLCHAIN_BIN=$(find . -name "mipsel-linux-uclibc-gcc" -exec dirname {} \; | head -1)
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN"
          echo "${TOOLCHAIN_BIN}" >> $GITHUB_PATH
          mipsel-linux-uclibc-gcc --version

      - name: Build uClibc target
        if: matrix.target == 'mipsel-linux-uclibc'
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly
          cat > .cargo/config.toml <<'EOF'
          [target.mipsel-unknown-linux-gnu]
          linker = "mipsel-linux-uclibc-gcc"
          EOF
          RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-static" \
          cargo +nightly build --release -p rtragent \
            --target mipsel-unknown-linux-gnu \
            -Zbuild-std=std,core,alloc

      - name: Build (native)
        if: matrix.cross == false && matrix.target != 'mipsel-linux-uclibc'
        run: cargo build --release -p ${{ matrix.binary }} --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cross build --release -p ${{ matrix.binary }} --target ${{ matrix.target }} -Zbuild-std=std,core,alloc

      - name: Strip & Rename
        run: |
          BIN="${{ matrix.binary }}"
          TGT="${{ matrix.target }}"
          if [ "$TGT" = "mipsel-linux-uclibc" ]; then
            SRC="target/mipsel-unknown-linux-gnu/release/${BIN}"
          else
            SRC="target/${TGT}/release/${BIN}"
          fi
          OUT="${BIN}-${TGT}"
          if command -v llvm-strip &>/dev/null; then
            llvm-strip "$SRC" -o "$OUT" 2>/dev/null || cp "$SRC" "$OUT"
          else
            cp "$SRC" "$OUT"
          fi
          ls -lh "$OUT"
          echo "--- ELF interpreter check ---"
          readelf -l "$OUT" 2>/dev/null | grep "interpreter" || echo "(static, no interpreter)"
          echo "--- dynamic section check ---"
          readelf -d "$OUT" 2>/dev/null | head -5 || echo "(no dynamic section)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ matrix.binary }}-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display Files
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true